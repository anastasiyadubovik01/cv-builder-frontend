name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: frontend
      - name: Checkout backend
        uses: actions/checkout@v4
        with:
          repository: innowise-frontend/cv-backend
          path: backend

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install -g pnpm && pnpm install

      - name: Start backend with Docker Compose
        run: |
          cd backend/docker
          # Копируем наши файлы .env в папку docker
          cp ../../frontend/.github/playwright-env/cv_postgres.env .env.cv_postgres
          cp ../../frontend/.github/playwright-env/cv_backend.env .env.cv_backend
          # Запускаем контейнеры в фоновом режиме
          docker compose up -d
      - name: Wait for backend
        run: |
          echo "Waiting for backend to be ready..."
          timeout 60s bash -c 'until curl -s http://localhost:3001/api/graphql > /dev/null; do sleep 1; done'
          echo "Backend is ready."

      - name: Install Playwright Browsers
        run: |
          cd frontend
          pnpm exec playwright install --with-deps

      - name: Run Playwright tests
        run: |
          cd frontend
          pnpm exec playwright test
        env:
          NEXT_PUBLIC_GRAPHQL_URL: http://localhost:3001/api/graphql

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30